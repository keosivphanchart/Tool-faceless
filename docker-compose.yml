services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
      - ./faceless_pipeline.db:/app/faceless_pipeline.db
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
