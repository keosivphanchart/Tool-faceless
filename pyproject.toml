[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceless-pipeline"
version = "0.1.0"
description = "Faceless short-form content pipeline: trend finder through publish + analytics feedback loop."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "requests==2.32.3",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
trends = [
    "pytrends==4.9.2",
    "google-api-python-client==2.147.0",
    "praw==7.7.1",
    "rapidfuzz==3.9.7",
    "numpy>=1.26,<3",  # required by rapidfuzz.process.cdist's return type
]
scripts = ["anthropic==0.34.2"]
voice = [
    "kokoro>=0.3.4",
    "soundfile==0.12.1",
]
video = [
    "faster-whisper==1.0.3",
]
publisher = [
    "google-auth==2.34.0",
    "google-auth-oauthlib==1.2.1",
]
analytics = ["pandas==2.2.3"]
dev = [
    "pytest==8.3.3",
    "pytest-mock==3.14.0",
    "httpx==0.27.2",
]
all = [
    "faceless-pipeline[trends,scripts,voice,video,publisher,analytics,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
